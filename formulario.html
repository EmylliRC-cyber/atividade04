<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscrição</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="dossierForm" action="https://formspree.io/f/maqgkjyy" method="POST" novalidate>

        <div class="case-file">
            <span class="tab">Formulario</span>

            <div class="folder">
                <h1>Formulario de <span>Inscrição</span></h1>

                <div class="subtitle">
                    Preencha os dados abaixo para se inscrever como dev. full stack.
                </div>

                <div class="grid">

                    <div class="field full">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Satoro Gojo" required>
                        <div class="hint" id="hint-nome"></div>
                    </div>

                    <div class="field full">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="fulano@gmail.com" required>
                        <div class="hint" id="hint-email"></div>
                    </div>

                    <div class="field">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                        <div class="hint" id="hint-cep"></div>
                    </div>

                    <div class="field">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" placeholder="Preenchido pelo CEP" required>
                        <div class="hint" id="hint-rua"></div>
                    </div>

                    <div class="field">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" placeholder="123" required>
                    </div>

                    <div class="field full">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                        <div class="hint" id="hint-telefone"></div>
                    </div>

                    <div class="field full">
                        <label for="comentario">Comentário</label>
                        <textarea id="comentario" name="comentario" placeholder="O que achou do nosso site?" required></textarea>
                    </div>

                </div>

                <div class="submit-row">
                    <button type="submit" id="btnEnviar">Enviar</button>
                    <span class="status" id="status"></span>
                </div>

            </div>
        </div>

    </form>

    <script src="script2.js"></script>

</body>

</html>
